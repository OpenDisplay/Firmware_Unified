# On-glass reports for generated drive data (generated/drive_presets.json).
#
# panels.yaml stays frozen to the hand-written entries. A generated entry keeps `status:
# equivalent` (where its bytes came from); a report here marks the modes someone saw drawing
# correctly on a real panel as `verified: glass`, and the entry's `verified` becomes `glass` once
# mode 0 has been seen. gen_all.py reads this file and lists every report in coverage.md.
#
# A report applies only while targets.<target_class>.framed_hex still hashes to framed_sha256.
# Regenerated bytes are new data and need a new sighting; the old report stays here and
# coverage.md lists it as not applied.
#
# One record per sighting:
#   panel          key in drive_presets.json ("0x0037"), not an alias
#   target_class   default | bg22: the class whose packets were written
#   framed_sha256  sha256 of bytes.fromhex(targets.<target_class>.framed_hex) as written
#   modes          mode names seen drawing correctly ([full]); a mode not listed stays unproven
#   board          the driver board (and module) it ran on
#   firmware       firmware version on the device
#   date           YYYY-MM-DD
#   reporter       who saw it (GitHub handle)
#   source         issue / PR / checklist link with the details
#   note           optional: what was drawn, what was not tried
reports:
  - panel: "0x0037"
    target_class: default
    framed_sha256: 2f5ef68fcc4b8615804d1b3fd2722d6da7205d81e5fcd43b69fe290b69417773
    modes: [full]
    board: Seeed EN05 (XIAO nRF52840 Plus)
    firmware: 3.0.2
    date: 2026-11-18
    reporter: g4bri3lDev
    source: https://github.com/OpenDisplay/Firmware_Unified/issues/105
    note: >-
      3.97in BWRY 800x480, ribbon FPC-770, label 0397sw-f8. Packets from drive-presets.json
      (opendisplay.org v3/website b7df514, identical bytes). Full refresh of four solid
      black/white/red/yellow bands with labels, no dithering: colours, text and borders right,
      no mirroring or offset. fast not tried.
  - panel: "0x0023"
    target_class: default
    framed_sha256: ad098111414d7b4d82d1907b7793c767ce99c247cbaff8886d90bd473478517a
    modes: [full]
    board: Seeed reTerminal E1002 (ESP32-S3)
    firmware: 3.0.2
    date: 2026-11-16
    reporter: g4bri3lDev
    source: https://github.com/OpenDisplay/Firmware_Unified/issues/109
    note: >-
      7.3in Spectra 6 800x480: a correct six-colour image. The issue names neither the mode nor
      the packet source; recorded as mode 0 (full) from py-opendisplay's vendored copy, which is
      the website's b7df514 file (identical bytes). To be confirmed by the reporter.
  - panel: "0x0023"
    target_class: default
    framed_sha256: ad098111414d7b4d82d1907b7793c767ce99c247cbaff8886d90bd473478517a
    modes: [full]
    board: Seeed reTerminal E1002 (ESP32-S3)
    firmware: 3.0.2
    date: 2026-11-24
    reporter: g4bri3lDev
    source: https://github.com/OpenDisplay/Firmware_Unified/issues/109
    note: >-
      Again after a 2.x -> 3.0 config migration from the same presets: correct six-colour image.
