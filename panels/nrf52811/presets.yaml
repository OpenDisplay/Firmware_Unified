# nRF52811 (Firmware_NRF) drive presets: THE SOURCE. panels/tools/gen_nrf52811.py encodes it into
# panels/generated/drive_presets_nrf52811.json. See panels/nrf52811/README.md.
meta:
  schema: opendisplay.drive_presets
  schema_version: 1
  schema_minor: 3
  provisional_ids: true
  caps:
    nrf52811: 2000
    max_steps: 128
    sleep_max: 20
  target_classes:
    nrf52811:
      max_steps: 128
      window: false
      config: 2000
      targets:
      - nrf52811
  transforms:
    T1: software plane inversion moved into the controller's polarity register
    T2: bare data byte joined to the preceding command
    T3: reset pulse 10 ms per phase instead of 50 ms
    T4: BWRY frame is the full 2 bpp frame
    T5: reset before sleep left out
    T6: sleep delay dropped to fit 20 B
  statuses:
    equivalent: replays token-identical to the 2.x driver after the transforms
    extracted: replays token-identical to an op list that was not compiled
    corrected: replays token-identical to its source with the listed deviations; the uncorrected packets
      are under alternatives
    glass: equivalent or corrected, and these packets were checked on a real panel (see verified)
    blocked: cannot be expressed on this target
