name: Release

# A tag `vX.Y.Z` builds every target with that version stamped in and publishes the images as a
# GitHub release. Run by hand with a version to get the same build as workflow artifacts only,
# without a release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version to stamp (for example 3.0.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${TAG#v}"; else v="${INPUT#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version '$v' is not X.Y.Z"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: publish
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist

      # Each target writes its own MANIFEST into release/, so the three artifacts do not
      # collide; the logs/ directories are left out of the release.
      - name: Collect images
        run: |
          mkdir -p out
          find dist -type f ! -path '*/logs/*' -exec cp -n {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS )
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
            --title "OpenDisplay firmware $TAG" --generate-notes --draft
