name: Build targets

# Reusable: builds all three firmware targets and uploads each target's release/ directory as
# an artifact, already normalised by tools/release/collect.py into the asset set that
# docs/RELEASE_ARTEFACTS.md defines. ci.yml calls it for every push and pull request;
# release.yml calls it for a tag and publishes the artifacts.
#
# Three jobs rather than one because the toolchains (ESP-IDF, nRF Connect SDK, Simplicity SDK)
# share nothing, and an image carrying all three would be enormous and slow to pull.
#
# VERSION: every job resolves its version through tools/release/version.sh: the caller's
# version (a tag) when given, else the in-source default. It exports the result as
# OD_FW_VERSION, so every image is stamped explicitly. The targets derive the rest from that one
# string: ESP32 PROJECT_VER, the 0x0043 reply, and BG22's SL_APPLICATION_VERSION.

on:
  workflow_call:
    inputs:
      version:
        description: Firmware version stamped into every image (X.Y.Z or vX.Y.Z); empty uses the in-source default.
        type: string
        default: ''
    secrets:
      OD_MCUBOOT_KEY_P256:
        description: PEM of the nRF52840 MCUboot signing key (ECDSA-P256). Unset uses MCUboot's debug key.
        required: false
      OD_MCUBOOT_KEY_ED25519:
        description: PEM of the nRF54 MCUboot signing key (Ed25519). Unset uses MCUboot's debug key.
        required: false

permissions:
  contents: read

jobs:
  esp32:
    name: esp32-idf
    runs-on: ubuntu-24.04
    # The version docs/TOOLCHAINS.md pins. build.sh sources ESP-IDF itself from $IDF_PATH.
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Resolve version
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
        run: echo "OD_FW_VERSION=$(tools/release/version.sh "$IN_VERSION")" >> "$GITHUB_ENV"

      # Every board, -debug ones included, so CI covers them. collect.py drops the -debug images
      # from the artifact: they are bench builds, not release assets.
      - name: Build every board fragment + sdkconfig baseline
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ( cd targets/esp32-idf && ./build.sh )
          targets/esp32-idf/tools/sdkconfig_baseline.sh

      - name: Collect release assets
        shell: bash
        run: python3 tools/release/collect.py fragment --target esp32-idf release

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: release/
          if-no-files-found: error

  nordic:
    name: nordic-zephyr
    runs-on: ubuntu-24.04
    # Nordic's published toolchain image for the pinned SDK. It carries west and the Zephyr SDK
    # but not the SDK sources, which are fetched below and cached by manifest revision.
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.3.1
    env:
      NCS_ROOT: ${{ github.workspace }}/.ncs/v3.3.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Resolve version
        env:
          IN_VERSION: ${{ inputs.version }}
        run: echo "OD_FW_VERSION=$(tools/release/version.sh "$IN_VERSION")" >> "$GITHUB_ENV"

      - name: Restore nRF Connect SDK v3.3.1
        id: ncs-cache
        uses: actions/cache@v4
        with:
          path: .ncs/v3.3.1
          key: ncs-v3.3.1-${{ runner.os }}

      - name: Fetch nRF Connect SDK v3.3.1
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.1 "$NCS_ROOT"
          cd "$NCS_ROOT"
          west update --narrow -o=--depth=1

      # The version the OpenDisplay/Firmware release uses for its NRF52840.zip, in its own venv
      # so it shares nothing with the NCS toolchain's Python.
      - name: Install adafruit-nrfutil
        run: |
          python3 -m venv "$RUNNER_TEMP/nrfutil"
          "$RUNNER_TEMP/nrfutil/bin/pip" install --quiet adafruit-nrfutil==0.5.3.post16
          echo "ADAFRUIT_NRFUTIL=$RUNNER_TEMP/nrfutil/bin/adafruit-nrfutil" >> "$GITHUB_ENV"

      # Both keys or neither: build.sh refuses a key directory that lacks the file a board
      # needs, so a half-configured secret fails the build instead of signing with the debug key.
      - name: MCUboot signing keys (optional)
        env:
          KEY_P256: ${{ secrets.OD_MCUBOOT_KEY_P256 }}
          KEY_ED25519: ${{ secrets.OD_MCUBOOT_KEY_ED25519 }}
        run: |
          if [ -z "$KEY_P256" ] && [ -z "$KEY_ED25519" ]; then
            echo "::warning::No MCUboot signing key configured: Nordic images are signed with MCUboot's published DEBUG key."
            exit 0
          fi
          d="$RUNNER_TEMP/mcuboot-keys"; mkdir -p "$d"; chmod 700 "$d"
          [ -n "$KEY_P256" ] && printf '%s\n' "$KEY_P256" > "$d/ecdsa-p256.pem"
          [ -n "$KEY_ED25519" ] && printf '%s\n' "$KEY_ED25519" > "$d/ed25519.pem"
          echo "OD_MCUBOOT_KEY_DIR=$d" >> "$GITHUB_ENV"

      - name: Build all boards
        run: |
          git config --global --add safe.directory '*'
          ( cd targets/nordic-zephyr && ./build.sh --all )

      - name: nRF52840 USB install packages
        run: tools/release/nrf52840_usb_packages.sh release

      - name: Collect release assets
        run: python3 tools/release/collect.py fragment --target nordic-zephyr release

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-nordic
          path: release/
          if-no-files-found: error

  silabs:
    name: efr32bg22-slc
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      SLT_VERSION: 1.2.1
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Resolve version
        env:
          IN_VERSION: ${{ inputs.version }}
        run: echo "OD_FW_VERSION=$(tools/release/version.sh "$IN_VERSION")" >> "$GITHUB_ENV"

      # The pinned Simplicity SDK 2025.12.2 is not on the public GitHub mirror (that stops at
      # v2025.6.3), so it comes from Silicon Labs' own installer, which is a public download.
      # The CMake files find the SDK, the GCC 12.2 toolchain and Ninja through `slt where`.
      - name: Restore Silicon Labs tools
        id: slt-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.silabs
            ~/slt
          key: slt-${{ env.SLT_VERSION }}-sisdk-2025.12.2-gcc-12.2.rel1

      - name: Install SLT and the Simplicity SDK
        if: steps.slt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/slt
          curl -fsSL -o /tmp/slt.zip \
            "https://www.silabs.com/documents/public/software/slt-cli-${SLT_VERSION}-linux-x64.zip"
          unzip -o /tmp/slt.zip -d ~/slt/pkg
          mkdir -p ~/slt/bin
          ln -sf "$(find ~/slt/pkg -type f -name slt | head -1)" ~/slt/bin/slt
          chmod +x ~/slt/bin/slt
          ~/slt/bin/slt --non-interactive install \
            simplicity-sdk/2025.12.2 gcc-arm-none-eabi/12.2.rel1 ninja cmake commander

      - name: Headless build
        run: |
          export PATH="$HOME/slt/bin:$PATH"
          slt where simplicity-sdk
          targets/efr32bg22-slc/build-and-flash.sh --clean --no-flash

      - name: Collect release assets
        run: python3 tools/release/collect.py fragment --target efr32bg22-slc release

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-silabs
          path: release/
          if-no-files-found: error
