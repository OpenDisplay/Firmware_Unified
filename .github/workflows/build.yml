name: Build targets

# Reusable: builds all three firmware targets in their release configuration and uploads each
# target's release/ directory as an artifact. ci.yml calls it for every push and pull request;
# release.yml calls it for a tag and publishes the artifacts.
#
# Three jobs rather than one because the toolchains (ESP-IDF, nRF Connect SDK, Simplicity SDK)
# share nothing, and an image carrying all three would be enormous and slow to pull.

on:
  workflow_call:
    inputs:
      version:
        description: Firmware version stamped into every image; empty keeps the 3.0.0 default.
        type: string
        default: ''

permissions:
  contents: read

env:
  OD_FW_VERSION: ${{ inputs.version }}

jobs:
  esp32:
    name: esp32-idf
    runs-on: ubuntu-24.04
    # The version docs/TOOLCHAINS.md pins. build.sh sources ESP-IDF itself from $IDF_PATH.
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Build every board fragment + sdkconfig baseline
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ( cd targets/esp32-idf && ./build.sh )
          targets/esp32-idf/tools/sdkconfig_baseline.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: release/
          if-no-files-found: error

  nordic:
    name: nordic-zephyr
    runs-on: ubuntu-24.04
    # Nordic's published toolchain image for the pinned SDK. It carries west and the Zephyr SDK
    # but not the SDK sources, which are fetched below and cached by manifest revision.
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.3.1
    env:
      NCS_ROOT: ${{ github.workspace }}/.ncs/v3.3.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Restore nRF Connect SDK v3.3.1
        id: ncs-cache
        uses: actions/cache@v4
        with:
          path: .ncs/v3.3.1
          key: ncs-v3.3.1-${{ runner.os }}

      - name: Fetch nRF Connect SDK v3.3.1
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.1 "$NCS_ROOT"
          cd "$NCS_ROOT"
          west update --narrow -o=--depth=1

      - name: Build all boards
        run: |
          git config --global --add safe.directory '*'
          ( cd targets/nordic-zephyr && ./build.sh --all )

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-nordic
          path: release/
          if-no-files-found: error

  silabs:
    name: efr32bg22-slc
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      SLT_VERSION: 1.2.1
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # The pinned Simplicity SDK 2025.12.2 is not on the public GitHub mirror (that stops at
      # v2025.6.3), so it comes from Silicon Labs' own installer, which is a public download.
      # The CMake files find the SDK, the GCC 12.2 toolchain and Ninja through `slt where`.
      - name: Restore Silicon Labs tools
        id: slt-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.silabs
            ~/slt
          key: slt-${{ env.SLT_VERSION }}-sisdk-2025.12.2-gcc-12.2.rel1

      - name: Install SLT and the Simplicity SDK
        if: steps.slt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/slt
          curl -fsSL -o /tmp/slt.zip \
            "https://www.silabs.com/documents/public/software/slt-cli-${SLT_VERSION}-linux-x64.zip"
          unzip -o /tmp/slt.zip -d ~/slt/pkg
          mkdir -p ~/slt/bin
          ln -sf "$(find ~/slt/pkg -type f -name slt | head -1)" ~/slt/bin/slt
          chmod +x ~/slt/bin/slt
          ~/slt/bin/slt --non-interactive install \
            simplicity-sdk/2025.12.2 gcc-arm-none-eabi/12.2.rel1 ninja cmake commander

      - name: Headless build
        run: |
          export PATH="$HOME/slt/bin:$PATH"
          slt where simplicity-sdk
          targets/efr32bg22-slc/build-and-flash.sh --clean --no-flash

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-silabs
          path: release/
          if-no-files-found: error
