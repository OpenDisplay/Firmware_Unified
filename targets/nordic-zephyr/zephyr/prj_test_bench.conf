# TEST-ONLY: appended by zephyr/CMakeLists.txt for a bench build (the SEC2 trace or the bench
# revert switch in the environment). Never part of a release build; the configure step
# refuses a bench build when OD_FW_VERSION or CI is set.
#
# Stack and heap headroom for `od stat` on the USB console (src/od_test_bench.c). These add a
# little RAM (thread names, stack painting) and change nothing else; RESET_ON_FATAL_ERROR is left
# at the release value on purpose, so a fatal error behaves as it would in the field.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
