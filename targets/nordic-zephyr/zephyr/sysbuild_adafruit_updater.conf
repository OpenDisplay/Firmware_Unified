# nRF52840: MCUboot in FIRMWARE UPDATER mode, chained behind the Adafruit bootloader.
#
# Boot order: Adafruit (0xF4000) -> MCUboot (0x27000) -> application, or -> firmware loader
# when an update is requested.
#
# WHY THIS RATHER THAN TWO EQUAL SLOTS. Classic dual-slot sizes the secondary to hold a full
# copy of the application, which on this part means two 368 kB slots and about 5% headroom
# against a 356,660-byte image. Firmware-updater mode makes the second image a small permanent
# SMP server instead of a staging copy: MCUboot boots the loader on request, the loader writes
# straight into the application slot, and the application slot keeps everything the loader
# does not need. The update path stops competing with the application for space.
#
# The trade is that the update is NOT atomic. There is no second copy to fall back to, so an
# interrupted transfer leaves the application slot invalid and MCUboot returns to the loader --
# recoverable over the air, but the device is not running the application until it succeeds.
# Dual-slot swaps back instead. That is the real decision between the two, not size alone.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_FIRMWARE_UPDATER=y

# Stock mcumgr SMP server as the loader. Measuring it first establishes whether a purpose-built
# loader is even needed -- a smaller custom one is only worth writing if this does not fit.
SB_CONFIG_FIRMWARE_LOADER_IMAGE_SMP_SVR=y

# HOW THE LOADER IS ENTERED. MCUboot refuses to build without this -- boot/zephyr/io.c emits
# "Firmware loader selected without an entrance mode set" -- and the choice is the whole remote
# story, so it is not a detail to leave defaulted.
#
# BOOT_MODE uses the retention boot-mode API: the application writes a request and resets, and
# MCUboot boots the loader instead of the application. That is a clean software path, which is
# exactly what this target lacked -- see the GPREGRET1 workaround in opendisplay_ble.c, written
# because an nRF52840 running this firmware had NO way back to a bootloader without someone
# physically double-tapping reset. The alternatives are worse here: ENTRANCE_GPIO needs a
# button held at boot, PIN_RESET needs a physical reset pattern, and NO_APPLICATION only
# triggers when the app slot is already invalid.
SB_CONFIG_MCUBOOT_MODE_FIRMWARE_UPDATER_BOOT_MODE_ENTRANCE=y
