# nRF52840 dual-slot MCUboot, chained behind the Adafruit bootloader, SoftDevice REMOVED.
#
# Used by the default nRF52840 build (OD_NRF52840_MCUBOOT unset or 1), and passed explicitly with -DPM_STATIC_YML_FILE.
# DELIBERATELY NOT NAMED pm_static_xiao_ble_nrf52840.yml: Partition Manager auto-applies a map
# named for the board to EVERY build of that board, which breaks the default Adafruit-only
# build with "'_sysbuild/mcuboot_primary_app_hex' ... missing and no known rule to make it".
#
# REQUIRES THE SOFTDEVICE TO HAVE BEEN ERASED from 0x1000..0x27000. Hardware-verified on an
# EN04: the Adafruit bootloader tests for the SoftDevice magic at 0x3004 and starts the
# application at MBR_SIZE (0x1000) instead of SD_SIZE_GET(MBR_SIZE) (0x27000) when it is
# absent -- CODE_REGION_1_START in the bootloader's dfu_types.h, and the else branch in
# bootloader_app_start(). Erasing it reclaims 152 kB, which is the whole reason dual-slot
# fits at all: against the old 0x27000 start the slots were 368 kB and the OTA-enabled image
# needed 371,152 B of them -- 98.6% full, 5 kB spare, and it did not boot.
#
# Zephyr never called the SoftDevice anyway; NCS links the SoftDevice CONTROLLER into the
# application image. The 152 kB was tribute to the bootloader's address arithmetic.
#
# THE ADAFRUIT BOOTLOADER AND MBR STAY. They are the only USB path on this board -- serial
# DFU, no mass storage, so no UF2 fallback if a bootloader write fails. Keeping them also
# keeps double-tap recovery, which is what makes a bad application image cost one tap rather
# than a debugger.
#
# settings_storage is 44 kB and ends exactly at the bootloader because DFU_APP_DATA_RESERVED
# is 10*4096 = 40 kB on nRF52840 (the bootloader's CMakeLists.txt; the 7*4096 in the
# nRF52832/52833 branches does NOT apply here). That span is preserved across a serial-DFU
# update, so display config and BLE bonds survive a reflash only while settings sits inside
# it.

mbr:
  address: 0x0
  size: 0x1000
  region: flash_primary

mcuboot:
  address: 0x1000
  size: 0xC000
  region: flash_primary

# 0xD000..0x7B000 (440 kB) IS DELIBERATELY LEFT UNDECLARED. Partition Manager needs EXACTLY
# ONE gap in a static map to place dynamic partitions into, and this is it: it becomes
# mcuboot_primary, i.e. mcuboot_pad plus the signed application. Declaring it -- even only
# the span -- gives "Incorrect amount of gaps found in static configuration ... Gaps found
# (0)", and hand-writing its sub-partitions displaces the entries the signing rules attach to.

# Equal to the primary: dual-slot swaps between the two, so the secondary must be able to
# hold a whole application. That symmetry is what buys atomic rollback, and it is affordable
# only now the SoftDevice hole is gone.
mcuboot_secondary:
  address: 0x7B000
  size: 0x6E000
  region: flash_primary

settings_storage:
  address: 0xE9000
  size: 0xB000
  region: flash_primary

adafruit_bootloader:
  address: 0xF4000
  size: 0xC000
  region: flash_primary
