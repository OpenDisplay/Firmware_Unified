# nRF52840 application overlay for MCUboot FIRMWARE-UPDATER mode.
#
# Distinct from prj_nrf52840_mcuboot.conf (the dual-slot overlay) in one important way: the
# application does NOT host the SMP server here. In firmware-updater mode the permanent
# firmware-loader image owns mcumgr and does the transfer; the application only has to be a
# signed MCUboot image and be able to ask for a reboot into the loader.
#
# Enabling the OTA sample on the application instead fails to compile, and the error names the
# reason: zephyr/subsys/dfu/boot/mcuboot.c "#error Missing partition definitions", followed by
# ACTIVE_SLOT_FLASH_AREA_ID undeclared. That code wants the classic two-image-slot layout, and
# firmware-updater mode deliberately does not have one -- there is no secondary slot to stage
# into, which is the whole point.
CONFIG_BOOTLOADER_MCUBOOT=y

# Refuse the SMP storage-erase command, matching the nRF54 build: nRF Connect Device Manager
# defaults to "Erase application settings" on DFU and would wipe display config and BLE bonds.
# Set on the application too, not only the loader, so the policy does not depend on which
# image happens to answer.
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
