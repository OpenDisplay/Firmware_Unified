# Probe overlay: is the external QSPI flash actually fitted on this board?
#
# The upstream xiao_ble devicetree declares a p25q16h (2 MB, JEDEC 85 60 15) on QSPI, but that
# is Seeed's map for the stock XIAO. EN04/EN05 are custom boards -- the one measured here even
# reports itself as "XIAO nRF52840 Plus" -- so the node existing in DT is not evidence the part
# is populated.
#
# This matters because it decides the OTA design. With the chip present, MCUboot's secondary
# slot can live in external flash and the internal app slot stays full size (~736 kB). Without
# it, both slots must fit internally at ~368 kB each, leaving about 5% headroom.
#
# The driver reads the JEDEC ID at init and fails if it does not match the DT node, so a clean
# init is positive evidence and an error names what it actually found. Not for production.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH=y
CONFIG_FLASH_LOG_LEVEL_DBG=y
