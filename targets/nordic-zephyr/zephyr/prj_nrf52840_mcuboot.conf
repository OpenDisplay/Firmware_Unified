# nRF52840 + chained MCUboot: re-enable what the board file turns off.
#
# boards/xiao_ble_nrf52840.conf disables MCUboot and the SMP OTA service because the default
# build for this part keeps the Adafruit bootloader alone (Milestone 7). This overlay is merged
# AFTER that file and only when OD_NRF52840_MCUBOOT=1, so the default build is unchanged.
#
# Without these three, CMD_ENTER_DFU is a lie on this target: od_cmd_app_enter_dfu() ACKs,
# opendisplay_ble_schedule_dfu() logs "unlocking SMP OTA", od_smp_sync() compiles to nothing
# because its guard symbol is off, and the host is told the device is ready for an update that
# cannot happen.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=y

# Refuse the SMP storage-erase command. nRF Connect Device Manager defaults to "Erase
# application settings" on DFU, which would wipe the display config and BLE bonds; the nRF54
# build already refuses it for this reason (README_SOURCE.md) and this target inherits the
# same policy rather than discovering it in the field.
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
