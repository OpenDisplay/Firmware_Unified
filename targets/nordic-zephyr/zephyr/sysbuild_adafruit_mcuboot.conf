# Sysbuild config for nRF52840 with MCUboot CHAINED behind the Adafruit bootloader.
#
# The default nRF52840 build uses sysbuild_adafruit.conf (MCUboot off, Milestone 7). This file
# is selected only when OD_NRF52840_MCUBOOT=1, and exists for the same reason that one does:
# SB_CONFIG_* are sysbuild Kconfig symbols read before any CMake here runs, so the choice
# cannot be made conditionally in sysbuild.cmake or overridden with -D.
#
# Chaining rather than replacing is deliberate. Installing MCUboot AT 0x0 would remove the
# Adafruit bootloader, and on the EN04 measured for this work that bootloader is the ONLY USB
# install path -- it exposes serial DFU and no mass-storage interface, so there is no UF2
# fallback if a bootloader write fails. Chained, MCUboot is just an application image at
# 0x27000: it is installed over the existing serial-DFU path, and that path survives it.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
